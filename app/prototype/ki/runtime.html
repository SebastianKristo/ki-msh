  window.addEventListener('touchmove', (e) => {
    if (!g) return;
    if (e.defaultPrevented && !g.on) { g = null; return; } // hurtigpanel, slider, sveip … tok gesten
    const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (!g.on) { if (dy < 12 || Math.abs(dx) > dy) { if (dy < -4 || Math.abs(dx) > 12) g = null; return; } g.on = true; g.y0 = t.clientY; }
    g.d = Math.max(0, (t.clientY - g.y0) * 0.5);
    if (e.cancelable) e.preventDefault();
    if (!g.hit && g.d >= TRIG) { g.hit = true; try { window.MSH && window.MSH.haptic && window.MSH.haptic('light'); } catch (x) {} } else if (g.hit && g.d < TRIG) g.hit = false;
    set(g.d);
  }, { passive: false });
  const end = () => {
    if (!g) return; const ok = g.on && g.d >= TRIG; g = null;
    if (!ok) { set(0, true); return; }
    busy = true; set(TRIG, true);
    svg.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 700, iterations: Infinity });
    setTimeout(() => location.reload(), 450);
  };
  window.addEventListener('touchend', end, { passive: true });
  window.addEventListener('touchcancel', () => { if (g) { g = null; set(0, true); } }, { passive: true });
}
</script>
