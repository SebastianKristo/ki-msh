<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#0f0f10;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 181 115)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
[data-hscroll]::-webkit-scrollbar{display:none}
@keyframes drift{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}100%{transform:translate(18px,-110px);opacity:0}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
</style>
<script src="./ha-picker.js"></script>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;margin:0 auto;background:#141416;padding:14px;display:flex;flex-direction:column;gap:18px">
  <section style="{{ heroCard }}">
    <div style="position:absolute;left:0;right:0;bottom:0;height:84px">
      <svg viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
        <polyline points="{{ gArea }}" style="{{ gFill }}"></polyline>
        <polyline points="{{ gLine }}" fill="none" style="{{ gStroke }}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
      </svg>
      <div style="{{ gCursor }}"><span style="{{ gDot }}"></span></div>
      <div onPointerDown="{{ gScrub }}" onPointerMove="{{ gScrubMove }}" onPointerLeave="{{ gScrubEnd }}" style="position:absolute;inset:0;touch-action:none;cursor:crosshair"></div>
    </div>
    <span class="ms" style="{{ heroIcon }}">{{ heroGlyph }}</span>
    <button style="position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,0.1);display:grid;place-items:center" style-active="transform:scale(0.92)"><span class="ms" style="font-size:22px;color:#fafafa">settings</span></button>
    <div style="position:absolute;left:18px;top:18px;right:120px;display:flex;align-items:center;gap:8px">
      <span style="font-size:13px;color:#afafaf">{{ name }}</span>
      <span style="{{ heroChip }}"><span class="ms" style="font-size:14px;font-variation-settings:'FILL' 1">{{ heroChipIcon }}</span>{{ heroChipText }}</span>
    </div>
    <div style="position:absolute;left:18px;top:54px;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:baseline;gap:8px;white-space:nowrap">
        <button onClick="{{ showT }}" style="{{ tBtn }}"><span style="font-size:44px;font-weight:300;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums">{{ tVal }}</span><span style="font-size:24px;font-weight:300">°</span></button>
        <button onClick="{{ showH }}" style="{{ hBtn }}"><span style="font-size:17px;font-weight:400;font-variant-numeric:tabular-nums">{{ hVal }}</span><span style="font-size:12px">%</span></button>
      </div>
      <span style="font-size:12px;color:#7f7f7f;white-space:nowrap">{{ gWhen }}</span>
    </div>
  </section>
</div>
</x-dc>

          gTabs: [seg('t', 'Temperatur'), seg('h', 'Fukt')],
          gTitle: isT ? 'Temperatur siste døgn · °C' : 'Luftfuktighet siste døgn · %',
          gHint: `${sel === 24 ? 'Nå' : `−${24 - sel} t`} · ${nf(ser[sel], isT ? 1 : 0)}${isT ? '°' : ' %'}`,
          gTicks: [0, 1, 2, 3].map(j => ({ label: nf(hi - (hi - lo) * j / 3, isT ? 1 : 0), line: { position: 'absolute', left: 0, right: 0, top: `${j / 3 * 100}%`, borderTop: j === 3 ? '1px solid #3a3a3a' : '1px dashed #2e2e32' } })),
          gLine: pts, gArea: `0,100 ${pts} 300,100`, gStroke: { stroke: gc }, gFill: { fill: a(gc, 0.2), stroke: 'none' },
          showT: () => this.setState({ gTab: 't' }), showH: () => this.setState({ gTab: 'h' }),
          tVal: nf(temps[sel]), hVal: nf(hums[sel], 0),
          tBtn: { display: 'flex', alignItems: 'flex-start', color: isT ? '#fafafa' : '#7f7f7f', transition: 'color .25s' },
          hBtn: { display: 'flex', alignItems: 'baseline', gap: 1, height: 26, padding: '0 9px', borderRadius: 13, background: isT ? 'transparent' : a(C.blue, 0.2), color: isT ? '#afafaf' : '#fafafa', transition: 'background .25s, color .25s' },
          gWhen: sel === 24 ? `Nå · ${isT ? `${nf(mn)}–${nf(mx)}°` : `${nf(Math.min(...hums), 0)}–${nf(Math.max(...hums), 0)} %`} siste døgn` : `−${24 - sel} t`,
          gCursor: { position: 'absolute', top: 0, bottom: 0, left: `${sel / 24 * 100}%`, borderLeft: `1px dashed ${a(gc, 0.6)}`, pointerEvents: 'none' },
          gDot: { position: 'absolute', left: -6, top: `calc(${Y(ser[sel])}% - 5px)`, width: 10, height: 10, borderRadius: 5, background: '#fafafa', boxShadow: `0 0 0 3px ${a(gc, 0.5)}` },
          gScrub: e => this.setState({ gSel: pos(e) }), gScrubMove: e => { if (e.buttons || e.pointerType === 'mouse') this.setState({ gSel: pos(e) }); }, gScrubEnd: () => this.setState({ gSel: null }),
        };
      })(),
    };
  }
}
</script>
</body>
</html>
