<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#252525;color:#f2f1ee;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#f2f1ee}a:hover{color:oklch(0.72 0.1 275)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
<script src="./i18n.js"></script>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:420px;min-height:100vh;margin:0 auto;background:#282828;padding:20px 18px 40px;display:flex;flex-direction:column;gap:22px">
  <header style="display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#8e8d89">Søvn</div>
    <button style="width:36px;height:36px;border-radius:18px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:20px">close</span></button>
  </header>

  <section style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="position:relative;width:200px;height:200px">
      <sc-for list="{{ ring }}" as="r" hint-placeholder-count="3"><div style="{{ r }}"></div></sc-for>
      <div style="position:absolute;inset:26px;border-radius:50%;background:#303030;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
        <span class="ms" style="{{ coreIcon }}">{{ coreIconName }}</span>
        <div style="font-size:30px;font-weight:500;letter-spacing:-0.03em;font-variant-numeric:tabular-nums">{{ asleep }}<span style="font-size:15px;color:#8e8d89;font-weight:400"> / {{ total }}</span></div>
        <div style="font-size:12px;color:#8e8d89">sover</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
      <div style="font-size:24px;font-weight:500;letter-spacing:-0.015em">{{ headline }}</div>
      <div style="font-size:14px;color:#8e8d89">{{ nextAlarm }}</div>
    </div>
  </section>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px;border-radius:20px;background:#303030">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.go }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
  </div>

  <sc-if value="{{ isSleep }}" hint-placeholder-val="{{ true }}">
    <section style="display:flex;flex-direction:column">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
        <button onClick="{{ p.toggle }}" style="{{ p.row }}">
          <span style="{{ p.iconWrap }}"><span class="ms" style="font-size:20px;font-variation-settings:'FILL' 1">{{ p.icon }}</span></span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left">
            <span style="font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px">{{ p.name }}<span style="{{ p.chip }}">{{ p.chipLabel }}</span></span>
            <span style="font-size:12px;color:#8e8d89">{{ p.sub }}</span>
          </div>
          <span style="{{ p.track }}"><span style="{{ p.knob }}"></span></span>
        </button>
      </sc-for>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;padding:0 4px">
        <div style="font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:#8e8d89">Siste 24 timer</div>
        <div style="font-size:12px;color:#6d6c69">hvem sov når</div>
      </div>
      <sc-for list="{{ timeline }}" as="t" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:70px;font-size:12px;color:#a9a7a2">{{ t.name }}</span>
          <div style="position:relative;flex:1;height:16px;border-radius:8px;background:#303030;overflow:hidden">
            <sc-for list="{{ t.segs }}" as="g" hint-placeholder-count="1"><span style="{{ g }}"></span></sc-for>
          </div>
        </div>
      </sc-for>
      <div style="display:flex;justify-content:space-between;padding-left:80px;font-size:10px;color:#6d6c69;font-variant-numeric:tabular-nums"><span>21</span><span>03</span><span>09</span><span>15</span><span>21</span></div>
    </section>
  </sc-if>

  <sc-if value="{{ isWake }}" hint-placeholder-val="{{ false }}">
    <section style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ alarms }}" as="w" hint-placeholder-count="3">
        <div style="{{ w.card }}">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="flex:1;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:13px;color:#8e8d89">{{ w.name }}</span>
              <div style="display:flex;align-items:center;gap:6px">
                <button onClick="{{ w.dec }}" style="width:32px;height:32px;border-radius:16px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:18px">remove</span></button>
                <span style="font-size:34px;font-weight:300;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;min-width:96px;text-align:center">{{ w.time }}</span>
                <button onClick="{{ w.inc }}" style="width:32px;height:32px;border-radius:16px;background:#3a3a3a;display:grid;place-items:center"><span class="ms" style="font-size:18px">add</span></button>
              </div>
            </div>
            <button onClick="{{ w.toggle }}" style="{{ w.track }}"><span style="{{ w.knob }}"></span></button>
          </div>
          <div style="display:flex;gap:4px">
            <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7"><button onClick="{{ d.go }}" style="{{ d.style }}">{{ d.l }}</button></sc-for>
          </div>
          <span style="font-size:12px;color:#8e8d89">{{ w.sub }}</span>
        </div>
      </sc-for>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:1000}}">
const MOON = 'oklch(0.72 0.1 275)', SUN = 'oklch(0.82 0.12 75)';
const a = (c, o) => c.replace(')', ` / ${o})`);
const PINK = 'linear-gradient(135deg, oklch(0.78 0.13 350), oklch(0.9 0.05 20))';
const pad = n => String(n).padStart(2, '0');
const hm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const NOW = 21 * 60 + 26;
const DAYS = ['M', 'T', 'O', 'T', 'F', 'L', 'S'];
class Component extends DCLogic {
  state = { tab: 'sleep', people: [
    { name: 'Cybele', asleep: false, window: true, night: [[23.0, 6.4]], alarm: 390, on: true, days: [1,1,1,1,1,0,0], light: true },
    { name: 'Rune', asleep: false, window: false, night: [[22.8, 7.8]], alarm: 420, on: true, days: [1,1,1,1,1,1,1], light: false },
    { name: 'Sebastian', asleep: false, window: false, night: [[23.6, 7.2], [15.5, 0.6]], alarm: 435, on: false, days: [1,1,1,1,1,0,0], light: true },
  ] };
  upd(i, f) { this.setState(s => ({ people: s.people.map((p, j) => j === i ? { ...p, ...f(p) } : p) })); }
  renderVals() {
    const s = this.state, n = s.people.length, asleep = s.people.filter(p => p.asleep).length;
    const sw = on => ({ track: { position: 'relative', width: 46, height: 28, borderRadius: 14, flex: 'none', background: on ? MOON : '#3a3a3d', transition: 'background .2s' }, knob: { position: 'absolute', top: 3, left: on ? 21 : 3, width: 22, height: 22, borderRadius: 11, background: '#f4f3ef', transition: 'left .2s' } });
    const on = s.people.filter(p => p.on).map(p => p.alarm).sort((x, y) => x - y);
    const next = on[0];
    const until = next != null ? ((next + 1440 - NOW) % 1440) : null;
    return {
      ring: s.people.map((p, i) => ({ position: 'absolute', inset: 0, borderRadius: '50%', background: `conic-gradient(from ${i * 120 + 4}deg, ${p.asleep ? MOON : '#3c3c3c'} 0 112deg, transparent 112deg)`, WebkitMask: 'radial-gradient(circle, transparent 84px, #000 85px)', mask: 'radial-gradient(circle, transparent 84px, #000 85px)', transition: 'background .4s' })),
      coreIcon: { fontSize: 28, color: asleep ? MOON : SUN, fontVariationSettings: "'FILL' 1" }, coreIconName: asleep ? 'bedtime' : 'light_mode',
      asleep, total: n,
      headline: asleep === 0 ? 'Alle er våkne' : asleep === n ? 'Alle sover' : `${s.people.filter(p => p.asleep).map(p => p.name).join(' og ')} sover`,
      nextAlarm: next != null ? `Neste vekking ${hm(next)} · om ${Math.floor(until / 60)} t ${until % 60} min` : 'Ingen vekking satt',
      tabs: [['sleep', 'Søvn'], ['wake', 'Vekking']].map(([k, label]) => ({ label, go: () => this.setState({ tab: k }), style: { height: 40, borderRadius: 16, fontSize: 13, fontWeight: 500, background: s.tab === k ? PINK : 'transparent', color: s.tab === k ? '#2a1720' : '#a9a7a2' } })),
      isSleep: s.tab === 'sleep', isWake: s.tab === 'wake',
      people: s.people.map((p, i) => { const w = sw(p.asleep); return { name: p.name, icon: p.asleep ? 'bedtime' : 'light_mode', track: w.track, knob: w.knob,
        sub: p.asleep ? 'Sover · lys dimmet, varsler av' : `Våken · sov ${Math.floor(p.night[0][1])} t ${Math.round((p.night[0][1] % 1) * 60)} min i natt`,
        chipLabel: p.window ? 'Vindu åpent' : '', chip: { display: p.window ? 'inline-flex' : 'none', fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 7, background: a('oklch(0.8 0.12 250)', 0.18), color: 'oklch(0.8 0.12 250)' },
        toggle: () => this.upd(i, x => ({ asleep: !x.asleep })),
        row: { display: 'flex', alignItems: 'center', gap: 12, padding: '12px 4px', width: '100%', borderTop: i ? '1px solid rgba(255,255,255,0.05)' : 'none' },
        iconWrap: { width: 42, height: 42, borderRadius: 21, flex: 'none', display: 'grid', placeItems: 'center', background: a(p.asleep ? MOON : SUN, 0.18), color: p.asleep ? MOON : SUN, transition: 'background .3s' } }; }),
      timeline: s.people.map(p => ({ name: p.name, segs: p.night.map(([start, dur]) => { const off = ((start - 21 + 24) % 24) / 24 * 100; return { position: 'absolute', top: 0, bottom: 0, left: `${off}%`, width: `${dur / 24 * 100}%`, borderRadius: 8, background: MOON }; }) })),
      alarms: s.people.map((p, i) => { const w = sw(p.on); return { name: p.name, time: hm(p.alarm), track: w.track, knob: w.knob,
        dec: () => this.upd(i, x => ({ alarm: (x.alarm - 15 + 1440) % 1440 })), inc: () => this.upd(i, x => ({ alarm: (x.alarm + 15) % 1440 })),
        toggle: () => this.upd(i, x => ({ on: !x.on })),
        sub: p.light ? 'Soloppgang-lys 20 min før · rullegardin opp' : 'Kun lyd på mobil',
        card: { display: 'flex', flexDirection: 'column', gap: 12, padding: 16, borderRadius: 24, background: '#303030', opacity: p.on ? 1 : 0.55, transition: 'opacity .2s' },
        days: DAYS.map((l, k) => ({ l, go: () => this.upd(i, x => ({ days: x.days.map((v, m) => m === k ? 1 - v : v) })), style: { flex: 1, height: 32, borderRadius: 16, fontSize: 12, fontWeight: 600, background: p.days[k] ? a(MOON, 0.9) : '#3a3a3a', color: p.days[k] ? '#252525' : '#8e8d89' } })) }; }),
    };
  }
}
</script>
</body>
</html>
