<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#232323;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fafafa}a:hover{color:rgb(242 133 201)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select{font:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;white-space:nowrap;font-feature-settings:'liga';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
</style>
<script src="./i18n.js"></script>
</helmet>
<div style="box-sizing:border-box;width:100%;max-width:560px;min-height:100vh;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="Hjem v3.dc.html" style="width:44px;height:44px;border-radius:22px;background:#383838;display:grid;place-items:center;text-decoration:none;flex:none"><span class="ms" style="font-size:22px">arrow_back</span></a>
    <span style="flex:1;font-size:28px;font-weight:500">Tilpass alt</span>
    <button onClick="{{ jump.toggle }}" style="height:40px;padding:0 10px 0 14px;border-radius:20px;background:#383838;display:flex;align-items:center;gap:4px;font-size:13px;color:#c7c7c7"><span>{{ stepLabel }}</span><span class="ms" style="font-size:20px">list</span></button>
  </div>
  <div style="display:flex;gap:4px"><sc-for list="{{ dots }}" as="d" hint-placeholder-count="13"><button onClick="{{ d.go }}" title="{{ d.title }}" style="{{ d.style }}"></button></sc-for></div>
  <sc-if value="{{ jump.open }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;padding:6px;border-radius:28px;background:#2f2f2f">
      <sc-for list="{{ jump.list }}" as="j" hint-placeholder-count="13">
        <button onClick="{{ j.go }}" style="{{ j.style }}"><span class="ms" style="font-size:20px;color:#afafaf">{{ j.icon }}</span><span style="flex:1;text-align:left">{{ j.title }}</span><span style="font-size:12px;color:#7f7f7f">{{ j.n }}</span></button>
      </sc-for>
    </div>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font-size:24px;font-weight:500">{{ cur.title }}</span>
    <span style="font-size:15px;color:#bdbdbd;line-height:1.5;text-wrap:pretty">{{ cur.sub }}</span>
  </div>

  <sc-if value="{{ isLang }}" hint-placeholder-val="{{ false }}">
    <div data-noi18n="1" style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ langs }}" as="l" hint-placeholder-count="2">
        <button onClick="{{ l.go }}" style="{{ l.style }}">
          <span style="{{ l.iconWrap }}">{{ l.code }}</span>
          <span style="flex:1;display:flex;flex-direction:column;gap:2px;text-align:left"><span style="font-size:17px;font-weight:500">{{ l.label }}</span><span style="font-size:13px;color:#9a9a9a">{{ l.sub }}</span></span>
          <span class="ms" style="{{ l.check }}">check_circle</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isDevice }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <sc-for list="{{ presets }}" as="p" hint-placeholder-count="4">
        <button onClick="{{ p.go }}" style="{{ p.style }}">
          <span style="{{ p.thumb }}"><sc-for list="{{ p.blocks }}" as="b" hint-placeholder-count="4"><span style="{{ b }}"></span></sc-for></span>
          <span style="font-size:16px;font-weight:600;text-align:left">{{ p.label }}</span>
          <span style="font-size:12px;color:#9a9a9a;text-align:left;line-height:1.4">{{ p.sub }}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{ previewHref }}" hint-placeholder-val="{{ false }}"><a href="{{ previewHref }}" style="height:48px;border-radius:24px;background:#383838;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;text-decoration:none"><span class="ms" style="font-size:20px">open_in_new</span>Forhåndsvis {{ presetName }}</a></sc-if>
  </sc-if>

  <sc-if value="{{ isSrv }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ srv.list }}" as="v" hint-placeholder-count="1">
        <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:32px;background:#383838">
          <button onClick="{{ v.cycle }}" title="Trykk på ikonet for å bytte." style="{{ v.iconWrap }}"><span class="ms" style="font-size:24px">{{ v.icon }}</span></button>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
            <input value="{{ v.name }}" onChange="{{ v.setName }}" placeholder="Navn, f.eks. Oslo eller Hytta" style="width:100%;box-sizing:border-box;height:30px;border:0;outline:none;background:none;color:#fafafa;font-size:16px;font-weight:500;padding:0">
            <input value="{{ v.url }}" onChange="{{ v.setUrl }}" placeholder="Adresse (valgfritt)" style="width:100%;box-sizing:border-box;height:22px;border:0;outline:none;background:none;color:#9a9a9a;font-size:13px;padding:0">
          </div>
          <sc-if value="{{ v.isFirst }}" hint-placeholder-val="{{ true }}"><span style="flex:none;font-size:12px;color:#9a9a9a;padding-right:10px">Denne serveren</span></sc-if>
          <sc-if value="{{ v.canDel }}" hint-placeholder-val="{{ false }}"><button onClick="{{ v.del }}" title="Fjern" style="width:40px;height:40px;border-radius:20px;flex:none;display:grid;place-items:center;background:rgb(242 128 115 / 0.2);color:rgb(242 128 115)"><span class="ms" style="font-size:20px">close</span></button></sc-if>
        </div>
      </sc-for>
      <button onClick="{{ srv.add }}" style="height:56px;border-radius:28px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500"><span class="ms" style="font-size:22px">add</span>Legg til server</button>
      <span style="font-size:12px;color:#9a9a9a;padding:6px 6px 0">Forslag</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ srv.chips }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.go }}" style="height:36px;padding:0 14px 0 10px;border-radius:18px;background:#383838;display:flex;align-items:center;gap:6px;font-size:14px"><span class="ms" style="font-size:18px">{{ c.icon }}</span>{{ c.label }}</button></sc-for>
      </div>
    </div>
  </sc-if>

  <sc-for list="{{ st.groups }}" as="g" hint-placeholder-count="0">
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-if value="{{ g.hasHead }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:500;color:#9a9a9a;padding:6px 6px 0">{{ g.head }}</span></sc-if>
      <sc-for list="{{ g.segs }}" as="sg" hint-placeholder-count="0">
        <div style="display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:24px;background:#383838">
          <span style="font-size:14px;font-weight:500">{{ sg.label }}</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ sg.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.go }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div>
          <sc-if value="{{ sg.hasNote }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#9a9a9a;line-height:1.4">{{ sg.note }}</span></sc-if>
        </div>
      </sc-for>
      <sc-for list="{{ g.fields }}" as="f" hint-placeholder-count="0">
        <label style="display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:24px;background:#383838">
          <span style="font-size:12px;color:#9a9a9a">{{ f.label }}</span>
          <input value="{{ f.v }}" onChange="{{ f.set }}" placeholder="{{ f.ph }}" style="{{ f.inputS }}">
          <sc-if value="{{ f.hasTokens }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ f.tokens }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.go }}" style="height:30px;padding:0 12px;border-radius:15px;background:#4a4a4a;font-size:12px">{{ t.label }}</button></sc-for></div></sc-if>
        </label>
      </sc-for>
      <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="0">
        <button onClick="{{ r.go }}" style="display:flex;align-items:center;gap:14px;min-height:72px;padding:0 18px 0 8px;border-radius:36px;background:#383838">
          <span style="{{ r.iconWrap }}"><span class="ms" style="font-size:24px">{{ r.icon }}</span></span>
          <span style="flex:1;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0"><span style="font-size:16px;font-weight:500">{{ r.label }}</span><sc-if value="{{ r.sub }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#9a9a9a">{{ r.sub }}</span></sc-if></span>
          <span style="{{ r.track }}"><span style="{{ r.knob }}"></span></span>
        </button>
      </sc-for>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="0">
        <div style="{{ it.box }}">
          <div style="display:flex;align-items:center;gap:10px;min-width:0">
            <span style="{{ it.iconWrap }}"><span class="ms" style="font-size:22px">{{ it.icon }}</span></span>
            <sc-if value="{{ it.hasInput }}" hint-placeholder-val="{{ false }}"><input value="{{ it.label }}" onChange="{{ it.setLabel }}" style="flex:1;min-width:0;height:40px;border-radius:14px;border:0;outline:none;padding:0 12px;background:#2a2a2a;color:#fafafa;font-size:15px"></sc-if>
            <sc-if value="{{ it.noInput }}" hint-placeholder-val="{{ true }}"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span data-noi18n="{{ it.noTr }}" style="font-size:15px;font-weight:500">{{ it.label }}</span><sc-if value="{{ it.sub }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#9a9a9a">{{ it.sub }}</span></sc-if></span></sc-if>
            <sc-if value="{{ it.canMove }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex:none;border-radius:18px;background:#2a2a2a;padding:2px">
                <button onClick="{{ it.up }}" title="Flytt opp" style="{{ it.upS }}"><span class="ms" style="font-size:20px">expand_less</span></button>
                <button onClick="{{ it.down }}" title="Flytt ned" style="{{ it.downS }}"><span class="ms" style="font-size:20px">expand_more</span></button>
              </div>
            </sc-if>
            <sc-if value="{{ it.hasEye }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.eye }}" title="Vis / skjul" style="width:40px;height:40px;border-radius:20px;flex:none;display:grid;place-items:center;background:#2a2a2a"><span class="ms" style="{{ it.eyeS }}">{{ it.eyeIcon }}</span></button></sc-if>
            <sc-if value="{{ it.hasGo }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.go }}" style="height:36px;padding:0 14px;border-radius:18px;flex:none;background:#2a2a2a;font-size:13px">Endre</button></sc-if>
          </div>
          <sc-for list="{{ it.chipRows }}" as="cr" hint-placeholder-count="0">
            <div style="display:flex;flex-wrap:wrap;gap:6px;padding-left:2px"><sc-for list="{{ cr }}" as="c" hint-placeholder-count="2"><button onClick="{{ c.go }}" style="{{ c.style }}">{{ c.label }}</button></sc-for></div>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{ g.isProse }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ prose.list }}" as="p" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:24px;background:#383838">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="flex:1;font-size:12px;color:#9a9a9a">{{ p.nLabel }}</span>
              <div style="display:flex;border-radius:18px;background:#2a2a2a;padding:2px">
                <button onClick="{{ p.up }}" title="Flytt opp" style="{{ p.upS }}"><span class="ms" style="font-size:20px">expand_less</span></button>
                <button onClick="{{ p.down }}" title="Flytt ned" style="{{ p.downS }}"><span class="ms" style="font-size:20px">expand_more</span></button>
              </div>
              <button onClick="{{ p.del }}" title="Fjern" style="width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:rgb(242 128 115 / 0.2);color:rgb(242 128 115)"><span class="ms" style="font-size:18px">close</span></button>
            </div>
            <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px">
              <input value="{{ p.pre }}" onChange="{{ p.setPre }}" placeholder="Før" style="min-width:0;height:40px;border-radius:14px;border:0;outline:none;padding:0 10px;background:#2a2a2a;color:#fafafa;font-size:14px">
              <select value="{{ p.src }}" onChange="{{ p.setSrc }}" style="min-width:0;height:40px;border-radius:14px;border:0;outline:none;padding:0 8px;background:rgb(242 133 201 / 0.18);color:rgb(242 133 201);font-size:14px"><sc-for list="{{ p.opts }}" as="o" hint-placeholder-count="4"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.label }}</option></sc-for></select>
              <input value="{{ p.post }}" onChange="{{ p.setPost }}" placeholder="Etter" style="min-width:0;height:40px;border-radius:14px;border:0;outline:none;padding:0 10px;background:#2a2a2a;color:#fafafa;font-size:14px">
            </div>
          </div>
        </sc-for>
        <button onClick="{{ prose.add }}" style="height:52px;border-radius:26px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500"><span class="ms" style="font-size:22px">add</span>Legg til setning</button>
      </sc-if>
    </div>
  </sc-for>

  <div style="flex:1"></div>
  <div style="display:flex;gap:10px">
    <button onClick="{{ back }}" style="{{ backStyle }}">Tilbake</button>
    <button onClick="{{ next }}" style="flex:2;height:56px;border-radius:28px;background:linear-gradient(145deg, rgb(242 133 201) -10%, rgb(245 205 198) 100%);color:#2a1720;font-size:16px;font-weight:600">{{ nextLabel }}</button>
  </div>
</div>
</x-dc>
