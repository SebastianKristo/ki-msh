                      [[[
                        const v = entity && entity.attributes.per_person;
                        if (v === undefined || v === null) return '–';
                        return Math.round(v) + '<span style="font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;">L</span>';
                      ]]]
                - type: custom:button-card
                  template: universal_sensor_ny
                  entity: sensor.hjemme_forklart_av_sensorene
                  variables:
                    sub_text: Forklart av sensorene
                    icon: mdi:help-circle-outline
                    background_color: var(--gray200)
                    text_color: var(--gray1000)
                    main_text: |
                      [[[
                        if (!entity || isNaN(parseFloat(entity.state))) return '–';
                        return Math.round(parseFloat(entity.state)) + '<span style="font-size:14px;line-height:1.5em;margin-left:4px;font-weight:300;">%</span>';
                      ]]]
