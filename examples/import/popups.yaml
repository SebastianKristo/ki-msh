type: custom:bubble-card
card_type: pop-up
name: Tesla Model Y
icon: phu:tesla-icon
state: null
hash: '#tesla'
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px!important;
  } #header-container > div > div {
    background: var(--gray000)!important;
  }
  #header-container > button {background: none;}
  .icon-container {background-color:var(--gray1000)!important;}
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon {
    --mdc-icon-size: 24px !important;
  }
  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;
  }
  .bubble-close-button {
    background-color: var(--gray200) !important;
    border-radius: 50%;
  }

bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
sub_button:
  main: []
  bottom: []
slider_fill_orientation: left
slider_value_position: right
popup_mode: default
cards:
  - type: custom:gap-card
    height: 0
  - type: custom:ki-tesla-card
    navn: Tesla Model Y
    defrost:
      - switch.tesla_model_y_klima_climate_defrost
      - switch.tesla_model_y_klima_...
  - square: false
    type: grid
    columns: 5
    cards:
      - type: custom:button-card
        entity: switch.tesla_model_y_car_doors_locked
        aspect_ratio: 1/1
        show_name: false
        icon: phu:tesla-lock
        tap_action:
          action: toggle
          confirmation:
            text: >-
              [[[ return entity.state === "locked" ? "Låse opp bilen?" : "Låse
              bilen?"; ]]]
        hold_action:
          action: more-info
        extra_styles: >
          @keyframes ki-rist { 0%,85%,100% { transform: rotate(0); } 90% {
          transform: rotate(-12deg); } 95% { transform: rotate(12deg); } }
        state:
          - value: 'on'
            icon: mdi:lock-open-variant
            styles:
              card:
                - background: var(--orange)
              icon:
                - color: var(--black)
                - animation: ki-rist 3s ease-in-out infinite
        styles:
          icon:
            - color: inherit
          card:
            - border-radius: 24px
            - background: var(--gray200)
      - type: custom:button-card
        entity: button.folkevogn_honk_horn
        icon: phu:tesla-horn
        aspect_ratio: 1/1
        show_name: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.folkevogn_honk_horn
          confirmation:
            text: Tute med bilen?
        styles:
          icon:
            - color: inherit
          card:
            - border-radius: 24px
            - background: var(--gray200)
      - type: custom:button-card
        entity: switch.tesla_model_y_klima_climate_defrost
        icon: phu:tesla-defrost
        aspect_ratio: 1/1
        show_name: false
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        extra_styles: >
          @keyframes ki-pust { 0%,100% { transform: scale(1); } 50% { transform:
          scale(1.12); } }
        state:
          - value: 'on'
            styles:
              card:
                - background: var(--active-big)
              icon:
                - color: var(--black)
                - animation: ki-pust 2s ease-in-out infinite
        styles:
          icon:
            - color: inherit
          card:
            - border-radius: 24px
            - background: var(--gray200)
      - type: custom:button-card
        entity: switch.tesla_model_y_car_trunk_front
        icon: phu:tesla-hood
        aspect_ratio: 1/1
        show_name: false
        tap_action:
          action: toggle
          confirmation:
            text: >-
              [[[ return entity.state === "on" ? "Lukke frunken?" : "Åpne
              frunken?"; ]]]
        hold_action:
          action: more-info
        state:
          - value: true
