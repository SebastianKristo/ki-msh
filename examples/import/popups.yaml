type: custom:bubble-card
card_type: pop-up
name: Sir Sweeps
icon: mdi:robot-vacuum
state: null
hash: '#rolf'
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px!important;
  } #header-container > div > div {
    background: var(--gray000)!important;
  }     
  #header-container > button {background: none;}    
  .icon-container {background-color:var(--gray1000)!important;} 
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon {
    --mdc-icon-size: 24px !important;
  }
  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;

  }
  .bubble-close-button {
    background-color: var(--gray200) !important;
    border-radius: 50%;
  }


bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
show_header: true
sub_button:
  main:
    - show_background: false
      entity: vacuum.rolf
      icon: mdi:none
      state_content:
        - state
        - battery_level
  bottom: []
button_type: name
scrolling_effect: false
slider_fill_orientation: left
slider_value_position: right
cards:
  - type: custom:gap-card
    height: 0
  - type: custom:ki-robot-card
    modell: stovsuger
    entity: vacuum.sir_sweeps_a_lot
    navn: Sir Sweeps
    varsel: binary_sensor.sir_sweeps_a_lot_water_shortage
    varsel_tekst: Vanntanken er tom
    batteri: sensor.sir_sweeps_a_lot_battery
    lader: binary_sensor.sir_sweeps_a_lot_charging
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.rolf_water_shortage
        state: 'on'
    card:
      type: custom:button-card
      name: >-
        [[[ return '<strong>Vanntanken er tom.</strong> Fyll på før neste
        mopping.' ]]]
      icon: mdi:water-off-outline
      custom_fields:
        btn:
          card:
            type: custom:paper-buttons-row
            styles:
              justify-content: flex-start
              gap: 6px
              margin-right: 10px
            buttons:
              - layout: icon
                icon: mdi:delete-empty
                entity: script.rolf_empty
                tap_action:
                  action: toggle
                styles:
                  button:
                    flex-basis: 1
                    flex-shrink: 0
                    background-color: rgba(0,0,0, 0.1)
                    height: 34px
                    width: 34px
                    border-radius: 50%
                    border: 1px solid rgba(0,0,0, 0.1)
                  icon:
                    color: var(--black)
      extra_styles: >
        @keyframes ki-drypp { 0%,100% { transform: translateY(0); } 50% {
        transform: translateY(2px); } }
      styles:
        card:
          - padding: 0
          - margin-top: 8px
          - background: var(--red)
        grid:
          - grid-template-areas: '"i n btn"'
          - grid-template-columns: 76px 1fr
        img_cell:
          - justify-self: start
          - background: rgba(0,0,0, 0.1)
          - margin: 4px 4px
          - border-radius: 50%
          - width: 58px
          - height: 58px
        icon:
          - width: 30px
          - height: 30px
          - color: var(--black)
          - animation: ki-drypp 1.4s ease-in-out infinite
        name:
          - justify-self: start
          - color: var(--black)
          - font-size: 14px
  - type: custom:gap-card
    height: 1
  - type: custom:ki-tabs-card
    fane_hoyde: 7
    tabs:
      - title: Renhold
        card:
          type: vertical-stack
          cards:
            - type: grid
              columns: 2
              square: false
              cards:
                - type: vertical-stack
                  cards:
                    - type: custom:button-card
                      template: template_sensor_big
                      show_name: false
                      entity: input_boolean.sir_sweeps_a_lot_sebsatian_soverom
                      name: ''
                      tap_action:
                        action: toggle
                      variables:
                        text_main: Soverom
                        icon: mdi:bed-double-outline
                        background: var(--gray200)
                        margin: 0
                        height: 152px
                        action: tap
                      state:
                        - value: 'on'
                          styles:
                            card:
                              - background: var(--active-big)
                            name:
                              - color: var(--black)
                            label:
                              - color: var(--black)
                            icon:
                              - color: var(--black)
                            img_cell:
                              - background: rgba(var(--highlight_active))
                    - type: custom:button-card
                      template: template_sensor_big
                      show_name: false
                      entity: input_boolean.sir_sweeps_a_lot_pappa_soverom
                      tap_action:
                        action: toggle
                      variables:
                        text_main: Pappa
                        icon: mdi:bed-outline
                        background: var(--gray200)
                        margin: 12px
                        height: 152px
                        action: tap
                      state:
                        - value: 'on'
                          styles:
                            card:
                              - background: var(--active-big)
                            name:
                              - color: var(--black)
                            label:
                              - color: var(--black)
                            icon:
                              - color: var(--black)
                            img_cell:
                              - background: rgba(var(--highlight_active))
                - type: vertical-stack
                  cards:
                    - type: custom:button-card
                      template: template_sensor_small
                      show_name: false
                      entity: input_boolean.sir_sweeps_a_lot_mamma_soverom
                      tap_action:
                        action: toggle
                      variables:
                        text_main: Mamma
                        icon: mdi:bed-queen-outline
                        background: var(--gray200)
                        margin: 0
                        action: tap
                      styles:
                        grid:
                          - grid-template-areas: '"i l" "i l"'
                          - grid-template-columns: 76px 1fr
                          - grid-template-rows: 1fr 1fr
                        label:
                          - align-self: center
                      state:
                        - value: 'on'
                          styles:
                            card:
                              - background: var(--active-big)
                            name:
                              - color: var(--black)
                            label:
                              - color: var(--black)
                            icon:
                              - color: var(--black)
                            img_cell:
                              - background: rgba(var(--highlight_active))
                    - type: custom:button-card
                      template: template_sensor_big
                      show_name: false
                      entity: input_boolean.sir_sweeps_a_lot_pappa_kontor
                      tap_action:
                        action: toggle
                      variables:
                        text_main: Kontor
                        icon: mdi:desk
                        background: var(--gray200)
                        margin: 12px
                        action: tap
                      state:
                        - value: 'on'
                          styles:
                            card:
                              - background: var(--active-big)
                            name:
                              - color: var(--black)
                            label:
                              - color: var(--black)
                            icon:
                              - color: var(--black)
                            img_cell:
                              - background: rgba(var(--highlight_active))
                    - type: custom:button-card
                      template: template_sensor_small
                      show_name: false
                      entity: input_boolean.sir_sweeps_a_lot_trappegang
                      tap_action:
                        action: toggle
                      variables:
                        text_main: Trapp
                        icon: mdi:stairs
                        background: var(--gray200)
                        margin: 12px
                        action: tap
                      styles:
                        grid:
                          - grid-template-areas: '"i l" "i l"'
                          - grid-template-columns: 76px 1fr
                          - grid-template-rows: 1fr 1fr
                        label:
                          - align-self: center
                      state:
                        - value: 'on'
                          styles:
                            card:
                              - background: var(--active-big)
                            name:
                              - color: var(--black)
                            label:
                              - color: var(--black)
                            icon:
                              - color: var(--black)
                            img_cell:
                              - background: rgba(var(--highlight_active))
            - type: custom:button-card
              name: |
                [[[
                  if (states['sensor.rolf_all'].state == 'False')
                    return "Støvsug alt";
                  else
                    return "Støvsug valgte rom";
                ]]]
              icon: mdi:robot-vacuum
              entity: vacuum.sir_sweeps_a_lot
              triggers_update:
                - input_boolean.sir_sweeps_a_lot_mamma_soverom
                - input_boolean.sir_sweeps_a_lot_pappa_kontor
                - input_boolean.sir_sweeps_a_lot_pappa_soverom
                - input_boolean.sir_sweeps_a_lot_sebsatian_soverom
                - input_boolean.sir_sweeps_a_lot_trappegang
              tap_action:
                action: perform-action
                perform_action: script.start_sir_sweeps_a_lot_room_select
              custom_fields:
                btn:
                  card:
                    type: custom:paper-buttons-row
                    styles:
                      justify-content: flex-start
                      gap: 6px
                      margin-right: 10px
                    buttons:
                      - layout: icon
                        icon: mdi:pause
                        entity: vacuum.sir_sweeps_a_lot
                        state_icons:
                          paused: mdi:play
                          cleaning: mdi:pause
                        tap_action:
                          action: call-service
                          service: script.stovsuger_pause
                        styles:
                          button:
                            flex-basis: 1
                            flex-shrink: 0
                            background-color: rgba(0,0,0, 0.1)
                            height: 34px
                            width: 34px
                            border-radius: 50%
                            border: 1px solid rgba(0,0,0, 0.1)
                          icon:
                            color: var(--black)
                      - layout: icon
                        icon: mdi:home
                        entity: script.stovsuger_retuner_hjem
                        tap_action:
                          action: toggle
                        styles:
                          button:
                            flex-basis: 1
                            flex-shrink: 0
                            background-color: rgba(0,0,0, 0.1)
                            height: 34px
                            width: 34px
                            border-radius: 50%
                            border: 1px solid rgba(0,0,0, 0.1)
                          icon:
                            color: var(--black)
              state:
                - value: cleaning
                  name: Støvsuger
                  styles:
                    custom_fields:
                      btn:
                        - display: block
                    icon:
                      - animation: vacc 2s ease 0s infinite normal forwards
                - value: paused
                  name: Pauset
                  styles:
                    custom_fields:
                      btn:
                        - display: block
              extra_styles: |
                @keyframes vacc {
                    0% {
                        transform: rotate(0deg) translate(0);
                    }

                    20% {
                        transform: rotate(-5deg) translate(-3px, 3px);
                    }

                    40% {
                        transform: rotate(-12deg) translate(-3px, -3px);
                    }

                    60% {
                        transform: translate(3px, 3px);
                    }

                    80% {
                        transform: rotate(12deg) translate(3px, -3px);
                    }

                    100% {
                        transform: rotate(0deg) translate(0);
                    }
                }
              styles:
                card:
                  - padding: 0
                  - background: var(--green)
                  - margin-top: 12px
                grid:
                  - grid-template-areas: '"i n btn"'
                  - grid-template-columns: 76px 1fr
                img_cell:
                  - justify-self: start
                  - background: rgba(0,0,0, 0.1)
                  - margin: 4px 4px
                  - border-radius: 50%
                  - width: 58px
                  - height: 58px
                icon:
                  - width: 30px
                  - height: 30px
                  - color: var(--black)
                name:
                  - justify-self: start
                  - color: var(--black)
                custom_fields:
                  btn:
                    - display: none
            - type: custom:paper-buttons-row
              styles:
                gap: 8px
                justify-content: flex-start
                overflow-x: auto
                overflow-y: hidden
                margin: 36px 0 0 0
                padding: 0 1px
                width: 100%
                box-sizing: border-box
                overscroll-behavior-x: contain
                touch-action: pan-x
              extra_styles: |
                ::-webkit-scrollbar { display: none; }
              buttons:
                - icon: mdi:table-furniture
                  layout: icon|name
                  name: Spisebord lite
                  tap_action:
                    action: call-service
                    service: script.rolf_zone_stuebord
                  styles:
                    name:
                      color: var(--gray1000)
                      text-wrap: nowrap
                    button:
                      display: flex
                      background-color: var(--gray200)
                      border-radius: 24px
                      color: var(--white)
                      padding: 10px 20px 10px 15px
                    icon:
                      color: var(--gray1000)
                      padding-right: 10px
                - icon: mdi:table-furniture
                  layout: icon|name
                  name: Spisebord mye
                  tap_action:
                    action: call-service
                    service: script.rolf_zone_stuebord_mye
                  styles:
                    name:
                      color: var(--gray1000)
                      text-wrap: nowrap
                    button:
                      display: flex
                      background-color: var(--gray200)
                      border-radius: 24px
                      color: var(--white)
                      padding: 10px 20px 10px 15px
                    icon:
                      color: var(--gray1000)
                      padding-right: 10px
                - icon: mdi:table-furniture
                  layout: icon|name
                  name: Stue uten spisebord
                  tap_action:
                    action: call-service
                    service: script.rolf_zone_stue_uten_spisebord
                  styles:
                    name:
                      color: var(--gray1000)
                      text-wrap: nowrap
                    button:
                      display: flex
                      background-color: var(--gray200)
                      border-radius: 24px
                      color: var(--white)
                      padding: 10px 20px 10px 15px
                    icon:
                      color: var(--gray1000)
                      padding-right: 10px
                - icon: mdi:rug
                  layout: icon|name
                  name: Teppe stue
                  tap_action:
                    action: call-service
                    service: script.rolf_zone_teppe
                  styles:
                    name:
                      color: var(--gray1000)
                      text-wrap: nowrap
                    button:
                      display: flex
                      background-color: var(--gray200)
                      border-radius: 24px
                      color: var(--white)
                      padding: 10px 20px 10px 15px
                    icon:
                      color: var(--gray1000)
                      padding-right: 10px
                - icon: mdi:table-furniture
                  layout: icon|name
                  name: Kjøkkenbord
                  tap_action:
                    action: call-service
                    service: script.rolf_zone_kjokkenbord
                  styles:
                    name:
                      color: var(--gray1000)
                      text-wrap: nowrap
                    button:
                      display: flex
                      background-color: var(--gray200)
                      border-radius: 24px
                      color: var(--white)
                      padding: 10px 20px 10px 15px
                      margin-right: 36px
                    icon:
                      color: var(--gray1000)
                      padding-right: 10px
      - title: Kontroll
        card:
          type: vertical-stack
          cards:
            - type: grid
              columns: 1
              square: false
              cards:
                - type: grid
                  columns: 3
                  square: false
                  cards:
                    - type: custom:button-card
                      template: template_trigger_card
                      entity: vacuum.sir_sweeps_a_lot
                      state:
                        - value: paused
                          icon: mdi:play
                          name: Fortsett
                          styles:
                            card:
                              - background: var(--green)
                      tap_action:
                        action: call-service
                        service: script.stovsuger_start
                        target: {}
                      variables:
                        text_main: Pause
                        icon: mdi:pause
                        background: var(--red)
                        color: var(--black)
                        margin: 0
                    - type: custom:button-card
                      template: template_trigger_card
                      entity: script.stovsuger_pause
                      tap_action:
                        action: toggle
                      variables:
                        text_main: |
                          [[[ return 'Returner<br>hjem' ]]]
                        icon: mdi:home
                        background: var(--orange)
                        color: var(--black)
                        margin: 0
                    - type: custom:button-card
                      template: template_trigger_card
                      entity: script.rolf_empty
                      tap_action:
                        action: toggle
                      variables:
                        text_main: |
                          [[[ return 'Tøm<br>støvsuger' ]]]
                        icon: mdi:delete-empty
                        background: var(--gray1000)
                        color: var(--black)
                        margin: 0
                - type: grid
                  columns: 2
                  square: false
                  cards:
                    - type: custom:button-card
                      template: template_sensor_big
                      entity: script.cycle_vacuum_fan_speed
                      trigger_update:
                        - vacuum.sir_sweeps_a_lot
                      tap_action:
                        action: toggle
                      variables:
                        text_main: |
                          [[[
                            return states['vacuum.sir_sweeps_a_lot'].attributes.fan_speed
                          ]]]  
                        text_sub: Viftehastighet
                        icon: mdi:fan
                        background: var(--gray200)
                        margin: 0
                        height: 144px
                      styles:
                        label:
                          - text-transform: capitalize
                    - type: grid
                      columns: 1
                      square: false
                      cards:
                        - type: custom:button-card
                          template: template_sensor_small
                          entity: script.cycle_vacuum_fan_speed
                          trigger_update:
                            - vacuum.sir_sweeps_a_lot
                          tap_action:
                            action: toggle
                          variables:
                            text_main: |
                              [[[
                                return states['input_select.vacuum_fan_speed'].state
                              ]]]  
                            text_sub: Mopp modus
                            icon: mdi:broom
                            background: var(--gray200)
                            margin: 0
                          styles:
                            label:
                              - text-transform: capitalize
                        - type: custom:button-card
                          template: template_sensor_small
                          entity: script.vacuum_fan_speed
                          trigger_update:
                            - vacuum.sir_sweeps_a_lot
                          tap_action:
                            action: toggle
                          variables:
                            text_main: |
                              [[[
                                return states['input_select.vacuum_fan_speed'].state
                              ]]] 
                            text_sub: Mopp intensitet
                            icon: mdi:tune-variant
                            background: var(--gray200)
                            margin: 0
                          styles:
                            label:
                              - text-transform: capitalize
      - title: Info
        card:
          type: vertical-stack
          cards:
            - type: custom:paper-buttons-row
              styles:
                justify-content: flex-start
                flex-wrap: wrap
                font-size: 1.4em
                line-height: 1.2em
                gap: 0px
                margin-bottom: 24px
              buttons:
                - layout: name
                  name: Rolf har vasket
                  styles:
                    button:
                      flex-basis: 1
                      flex-shrink: 0
                    name:
                      color: var(--gray1000)
                - layout: name
                  entity: sensor.rolf_arbeidstid
                  name: >-
                    {{ states('sensor.sir_sweeps_a_lot_total_cleaning_area') |
                    round(0) }} m²
                  styles:
                    name:
                      color: var(--black)
                    button:
                      padding: 2px 8px
                      flex-basis: 1
                      flex-shrink: 0
                      display: flex
                      background-color: var(--gray1000)
                      border-radius: 24px
                - layout: name
                  name: som tilsvarer ca
                  styles:
                    button:
                      flex-basis: 1
                      flex-shrink: 0
                    name:
                      color: var(--gray1000)
                - layout: name
                  name: >-
                    {{ (states('sensor.sir_sweeps_a_lot_total_cleaning_area') |
                    round(0) / 7140) | round(1) }} fotballbaner
                  styles:
                    name:
                      color: var(--black)
                    button:
                      padding: 2px 8px
                      flex-basis: 1
                      flex-shrink: 0
                      display: flex
                      background-color: var(--gray1000)
                      border-radius: 24px
                - layout: name
                  name: ', det har han brukt mer enn'
                  styles:
                    button:
                      margin-left: -6px
                      flex-basis: 1
                      flex-shrink: 0
                    name:
                      color: var(--gray1000)
                - layout: name
                  name: >-
                    {% set time =
                    states('sensor.sir_sweeps_a_lot_total_cleaning_time').split(':')
                    %} {% set total_hours = time[0] | int %} {% set days =
                    (total_hours / 24) | int %} {% set remaining_hours =
                    total_hours % 24 %} {{ days }} dager og {{ remaining_hours
                    }} timer
                  styles:
                    name:
                      color: var(--black)
                    button:
                      padding: 2px 8px
                      flex-basis: 1
                      flex-shrink: 0
                      display: flex
                      background-color: var(--gray1000)
                      border-radius: 24px
                - layout: name
                  name: på til sammen.
                  styles:
                    button:
                      flex-basis: 1
                      flex-shrink: 0
                    name:
                      color: var(--gray1000)
            - type: grid
              square: false
              columns: 2
              cards:
                - type: custom:button-card
                  trigger_update:
                    - vacuum.sir_sweeps_a_lot
                  template: universal_sensor
                  variables:
                    size: small
                    sub_text: Hovedbørste
                    icon: mdi:broom
                    main_text: |
                      [[[
                        return Math.round(states['sensor.sir_sweeps_a_lot_main_brush_time_left'].state ) + ' timer igjen'
                      ]]] 
                - type: custom:button-card
                  trigger_update:
                    - vacuum.sir_sweeps_a_lot
                  template: universal_sensor
                  variables:
                    size: small
                    sub_text: Filter
                    icon: mdi:air-filter
                    main_text: |
                      [[[
                        return Math.round(states['sensor.sir_sweeps_a_lot_filter_time_left'].state ) + ' timer igjen'
                      ]]] 
                - type: custom:button-card
                  trigger_update:
                    - vacuum.sir_sweeps_a_lot
                  template: universal_sensor
                  variables:
                    size: small
                    sub_text: Sensor
                    icon: mdi:eye-outline
                    main_text: |
                      [[[
                        return Math.round(states['sensor.sir_sweeps_a_lot_sensor_time_left'].state ) + ' timer igjen'
                      ]]]
                - type: custom:button-card
                  trigger_update:
                    - vacuum.sir_sweeps_a_lot
                  template: universal_sensor
                  variables:
                    size: small
                    sub_text: Sidebørste
                    icon: mdi:brush
                    main_text: |
                      [[[
                        return Math.round(states['sensor.sir_sweeps_a_lot_side_brush_time_left'].state ) + ' timer igjen'
                      ]]]
      - title: Kart
        card:
          square: false
          type: grid
          columns: 1
          cards:
            - type: picture
              image_entity: image.sir_sweeps_a_lot_hjemme_andre_etasje
              theme: Mytheme_v2
    card_mod:
      style: |
        .tabs-container {
          width: fit-content !important;
          margin: 0 auto !important;
          padding: 2px 2px !important;
          border: 1px solid rgba(255, 255, 255, 0.3);
          border-radius: 999px;
          overflow: hidden !important;
        }
        .tab-button {
          border-radius: 999px !important;
          font-weight: 500;
        }
        .tab-button.active {
          background: var(--active-big) !important;
          color: rgba(70, 58, 64, 0.95) !important;
          box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
        }
  - type: custom:gap-card
    height: 36
state_content: battery_level



type: custom:bubble-card
card_type: pop-up
name: Server
icon: mdi:server
state: null
hash: '#server'
is_sidebar_hidden: true
styles: |+
  .bubble-pop-up-container {
    --vertical-stack-card-gap: 0px!important;
  } #header-container > div > div {
    background: var(--gray000)!important;
  }
  #header-container > button {background: none;}
  .icon-container {background-color:var(--gray1000)!important;}
  .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
  .bubble-icon {
    --mdc-icon-size: 24px !important;
  }
  .bubble-name {
    font-size: 30px !important;
    font-weight: 500;
    line-height: 1.4 !important;
    padding: 8px 0 !important;
  }
  .bubble-close-button {
    background-color: var(--gray200) !important;
    border-radius: 50%;
  }

bg_blur: '5'
shadow_opacity: '20'
bg_opacity: '98'
margin_top_mobile: 50px
margin_top_desktop: 50px
card_layout: large
button_type: name
sub_button:
  main: []
  bottom: []
slider_fill_orientation: left
slider_value_position: right
cards:
  - type: custom:gap-card
    height: 0
  - type: custom:ki-homelab-card
    navn: Homelab
  - type: conditional
    conditions:
