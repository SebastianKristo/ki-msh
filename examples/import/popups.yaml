              card:
                - background: var(--active-big)
              icon:
                - color: var(--black)
          - value: true
            styles:
              card:
                - background: var(--active-big)
              icon:
                - color: var(--black)
        styles:
          icon:
            - color: inherit
          card:
            - border-radius: 24px
            - background: var(--gray200)
      - type: custom:button-card
