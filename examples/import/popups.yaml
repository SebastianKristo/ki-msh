      - title: Kalender
        cards:
          - type: custom:button-card
            entity: sensor.alle_kalendere
            show_icon: false
            show_name: false
            tap_action:
              action: none
            custom_fields:
              event: |
                [[[
                  return entity.attributes.events[0].summary
