                  [[[
                    if (variables.size === 'small') return 'none';
                    return variables.state_rule_3_hide_alt_text ? 'none' : null;
                  ]]]
      - operator: template
        value: '[[[ return variables.badge_condition ]]]'
        styles:
          custom_fields:
            badge:
              - display: block
    custom_fields:
      badge: '[[[ return variables.badge_text ]]]'
      alt: '[[[ return variables.alt_text ]]]'
    styles:
      card:
        - height: '[[[ return variables.size === "small" ? "66px" : "160px" ]]]'
        - background: '[[[ return variables.background_color ]]]'
        - margin-top: '[[[ return variables.margin ]]]'
