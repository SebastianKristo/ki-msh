
paper_buttons_row:
  presets:
    weather:
      styles:
        state:
          font-size: 28px
          font-weight: 300
          line-height: 10px
          margin-top: 15px
        icon:
          width: 40px
          height: 40px
          margin-top: -30px
          border-radius: 0
          padding: 0
        button:
          width: 80px
          height: 170px
          flex-shrink: 0
          background-color: var(--gray200)
          border-radius: 24px
          color: var(--gray1000)
        name:
          position: absolute
          top: 0px
          margin: 0
          height: 170px
          font-weight: 400
          font-size: 13px
          line-height: 1.25
          white-space: pre-line
          text-align: center
          width: 100%
          opacity: 0.7
    button:
      styles:
        state:
          position: absolute
          top: 8px
          width: 36px
          height: 3px
          padding: 0
          background: var(--gray1000)
          border-radius: 5px
          opacity: 0.1
        name:
          color: var(--gray1000)
        button:
          padding: 12px
          width: 76px
          height: 76px
          flex-basis: 1
          flex-shrink: 0
          display: flex
          background-color: var(--gray200)
          border-radius: 24px
          color: var(--white)
        icon:
          --mdc-icon-size: 26px
          color: var(--gray1000)
          margin-top: 6px
decluttering_templates:
  ki_number_row:
    default:
      - decimals: 1
      - symbol: ''
      - background: var(--gray200)
    card:
      type: custom:button-card
      entity: '[[entity]]'
      icon: '[[icon]]'
      name: '[[name]]'
      show_label: true
      label: |
        [[[
          if (!entity) return '--';
          const v = parseFloat(entity.state);
          if (isNaN(v)) return entity.state;
          return v.toFixed([[decimals]]) + '[[symbol]]';
        ]]]
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      styles:
        card:
          - padding: 0
          - height: 66px
          - border-radius: 75px
          - background: '[[background]]'
          - box-shadow: none
          - --mdc-ripple-color: transparent
          - --ha-ripple-color: transparent
          - --ha-ripple-hover-opacity: 0
        grid:
          - grid-template-areas: '"i n btn" "i l btn"'
          - grid-template-columns: 76px 1fr auto
        img_cell:
          - justify-self: start
          - background: rgba(var(--highlight))
          - margin: 4px 4px
          - border-radius: 50%
          - width: 58px
          - height: 58px
        icon:
          - width: 30px
          - height: 30px
          - color: var(--gray1000)
        name:
          - justify-self: start
          - font-size: 16px
          - font-weight: 500
          - padding-top: 4px
          - color: var(--gray1000)
        label:
          - justify-self: start
          - font-size: 14px
          - opacity: '0.7'
          - padding-bottom: 7px
          - color: var(--gray1000)
        custom_fields:
          btn:
            - justify-self: end
            - align-self: center
            - line-height: 0
      custom_fields:
        btn:
          card:
            type: custom:paper-buttons-row
            styles:
              justify-content: flex-end
              align-items: center
              gap: 6px
              margin-right: 10px
            buttons:
              - layout: icon
                icon: mdi:minus
                tap_action:
                  action: perform-action
                  perform_action: input_number.decrement
                  target:
                    entity_id: '[[entity]]'
                styles:
                  button:
                    flex-shrink: 0
                    background-color: var(--gray400)
                    height: 34px
                    width: 34px
                    border-radius: 50%
                    border: 1px solid var(--gray300)
                  icon:
                    color: var(--gray1000)
              - layout: icon
                icon: mdi:plus
                tap_action:
                  action: perform-action
                  perform_action: input_number.increment
                  target:
                    entity_id: '[[entity]]'
                styles:
                  button:
                    flex-shrink: 0
                    background-color: var(--gray400)
                    height: 34px
                    width: 34px
                    border-radius: 50%
                    border: 1px solid var(--gray300)
                  icon:
                    color: var(--gray1000)
  small_light_toggle:
    card:
      type: horizontal-stack
      cards:
        - type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            grid-template-columns: 1fr max-content max-content
            grid-template-rows: min-content
            grid-template-areas: |
              "one two"
          cards:
            - type: custom:button-card
              view_layout:
                grid-area: one
              name: '[[name]]'
              entity: '[[entity]]'
              tap_action:
                action: more-info
              icon: '[[icon]]'
              styles:
                card:
                  - background: null
                  - padding: 10px 0 10px 0
                  - --mdc-ripple-press-opacity: 0
                name:
                  - font-size: 16px
                  - font-weight: bold
                  - justify-self: start
                  - align-self: center
                icon:
                  - width: 24px
                  - color: null
                grid:
                  - grid-template-columns: 54px 1fr
                  - grid-template-areas: '"i n" "i l"'
  light_sliderv2:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          entity: '[[entity]]'
          name: '[[name]]'
          icon: '[[icon]]'
          tap_action:
            action: none
          styles:
            grid:
              - grid-template-columns: 64px 1fr
              - grid-template-areas: '"i n"'
            card:
              - background: none
              - height: 65px
              - position: absolute
              - z-index: 1
            img_cell:
              - width: 22px
            icon:
              - width: 22px
              - color: var(--gray800)
            name:
              - justify-self: start
              - font-size: 16px
              - font-weight: 400
              - color: var(--gray800)
        - type: custom:my-slider-v2
          entity: '[[entity]]'
          allowTapping: false
          allowSliding: true
          styles:
            container:
              - border-radius: 35px
            card:
              - height: 65px
              - margin-bottom: 12px
              - border-radius: 35px
            progress:
              - background: |
                  [[[
                    const light = entity;
                    if (light.state === 'off' || !light.attributes.rgb_color) {
                      return 'linear-gradient(145deg, rgba(255,176,233,0.15) 0%,rgba(50,50,52,1) 50%)';
                    }
                    const rgb = light.attributes.rgb_color;
                    return `linear-gradient(145deg, rgba(255,176,233,0.05) 0%, rgba(${rgb[0]},${rgb[1]},${rgb[2]},1) 100%)`;
                  ]]]
            thumb:
              - width: 3px
              - height: 30%
              - background: var(--gray800)
              - border-radius: 5px
              - top: 36%
              - margin-right: 14px
            track:
              - background: >-
                  linear-gradient(145deg, rgba(255,176,233,0.15) 0%,
                  rgba(50,50,52,1) 50%)
  light_togglev2:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          entity: '[[entity]]'
          name: '[[name]]'
          icon: '[[icon]]'
          tap_action:
            action: toggle
          hold_action:
            action: more-info
          styles:
            grid:
              - grid-template-columns: 64px 1fr
              - grid-template-areas: '"i n"'
            card:
              - background: none
              - height: 65px
              - position: absolute
              - z-index: 1
            img_cell:
              - width: 22px
            icon:
              - width: 22px
              - color: var(--gray800)
            name:
              - justify-self: start
              - font-size: 16px
              - font-weight: 400
              - color: var(--gray800)
        - type: custom:my-slider-v2
          entity: '[[entity]]'
          allowTapping: false
          allowSliding: false
          styles:
            container:
              - border-radius: 35px
            card:
              - height: 65px
              - margin-bottom: 12px
              - border-radius: 35px
            progress:
              - background: >-
                  linear-gradient(145deg, rgba(255,176,233,0.05) 0%,
                  rgba(255,220,178.1) 0%)
            thumb:
              - width: 3px
              - height: 30%
              - background: var(--gray800)
              - border-radius: 5px
              - top: 36%
              - margin-right: 14px
            track:
              - background: |
                  [[[
                    if (entity.state === "on") {
                      return "linear-gradient(145deg, rgba(255,176,233,0.05) 0%, rgba(255,220,178,1) 100%)";
                    } else {
                      return "linear-gradient(145deg, rgba(255,176,233,0.15) 0%, rgba(50,50,52,1) 50%)";
                    }
                  ]]]
  light_slider:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          entity: '[[entity]]'
          name: '[[name]]'
          icon: '[[icon]]'
          tap_action:
            action: none
          styles:
            grid:
              - grid-template-columns: 64px 1fr
              - grid-template-areas: '"i n"'
            icon:
              - width: 22px
              - color: var(--gray100)
            img_cell:
              - width: 22px
              - height: 22px
            card:
              - background: none
              - height: 75px
              - padding: 0
              - z-index: 1
              - position: absolute
              - border-radius: 30px
            name:
              - justify-self: start
              - font-size: 16px
              - font-weight: 400
              - color: var(--gray100)
        - type: custom:my-slider-v2
          entity: '[[entity]]'
          allowTapping: false
          allowSliding: true
          disableScroll: false
          marginOfError: 50
          styles:
            container:
              - border-radius: 30px
            card:
              - height: 75px
              - border-radius: 30px
            progress:
              - background: var(--yellow)
            thumb:
              - width: 5px
              - height: 30%
              - top: 36%
              - margin-right: -6px
              - border-radius: 5px
              - background: var(--gray1000)
              - z-index: 2
            track:
              - background: var(--yellow-tint)
  light_toggle:
    card:
      type: custom:button-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      show_label: false
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      state:
        - value: 'on'
          styles:
            card:
              - background: var(--yellow)
        - value: 'off'
          styles:
            card:
              - background: var(--yellow-tint)
            name:
              - color: var(--gray100)
            icon:
              - color: var(--gray100)
        - value: unavailable
          styles:
            card:
              - background: var(--yellow-tint)
            name:
              - color: var(--gray100)
            icon:
              - color: var(--gray100)
      styles:
        grid:
          - grid-template-columns: 64px 1fr
          - grid-template-areas: '"i n"'
        icon:
          - width: 22px
          - color: var(--gray100)
        img_cell:
          - width: 22px
          - height: 22px
        card:
          - padding: 0
          - height: 75px
          - border-radius: 30px
        name:
          - justify-self: start
          - font-size: 16px
          - font-weight: 400
          - color: var(--gray100)
button_card_templates:
  jul_toggle:
    variables:
      entity: null
      icon: mdi:string-lights
      main_text: null
      sub_text: null
      color_on: var(--yellow)
      color_off: var(--gray200)
      text_on: var(--black)
      text_off: var(--gray1000)
    entity: '[[[ return variables.entity ]]]'
    icon: '[[[ return variables.icon ]]]'
    name: '[[[ return variables.main_text ]]]'
    label: '[[[ return variables.sub_text ]]]'
    show_label: true
    show_icon: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    state:
      - value: 'on'
        styles:
          card:
            - background: '[[[ return variables.color_on ]]]'
          img_cell:
            - background: rgba(0, 0, 0, 0.12)
          icon:
            - color: '[[[ return variables.text_on ]]]'
          name:
            - color: '[[[ return variables.text_on ]]]'
          label:
            - color: '[[[ return variables.text_on ]]]'
      - value: unavailable
        styles:
          card:
            - background: var(--gray200)
            - opacity: '0.4'
    styles:
      card:
        - height: 66px
        - border-radius: 75px
        - padding: 4px 20px 4px 4px
        - background: '[[[ return variables.color_off ]]]'
        - box-shadow: none
        - --mdc-ripple-color: transparent
        - --ha-ripple-color: transparent
        - --ha-ripple-hover-opacity: 0
      grid:
        - grid-template-columns: 76px 1fr min-content
        - grid-template-areas: '"i n toggle" "i l toggle"'
      img_cell:
        - justify-self: start
        - width: 30px
        - height: 30px
        - background: rgba(var(--highlight))
        - padding: 14px
        - border-radius: 50%
      icon:
        - width: 30px
        - height: 30px
        - color: '[[[ return variables.text_off ]]]'
      name:
        - justify-self: start
        - font-size: 16px
        - font-weight: 500
        - padding-top: 4px
        - color: '[[[ return variables.text_off ]]]'
      label:
        - justify-self: start
        - font-size: 14px
        - opacity: '0.7'
        - padding-bottom: 7px
        - color: '[[[ return variables.text_off ]]]'
      custom_fields:
        toggle:
          - justify-self: end
          - align-self: center
          - line-height: 0
    custom_fields:
      toggle: |
        [[[
          const isOn = entity && entity.state === 'on';
          const color = isOn ? variables.text_on : 'var(--gray400)';
          return `<ha-icon
            icon="${isOn ? 'mdi:toggle-switch' : 'mdi:toggle-switch-off'}"
            style="width:50px;height:40px;color:${color};display:block;">
          </ha-icon>`;
        ]]]
  universal_base:
    tap_action:
      action: more-info
    variables:
      entity: null
      mode: sensor
      size: big
      icon: mdi:alert
      main_text: null
      sub_text: Sensor
      alt_text: null
      bar_value: null
      bar_symbol: '%'
      bar_color: null
      bar_invert_colors: false
      background_color: var(--gray100)
      text_color: var(--gray1000)
      margin: 0
      badge_condition: null
      badge_text: '!'
      badge_color: var(--red)
      symbol: null
      show_timer: false
      state_rule_1_value: null
      state_rule_1_condition: false
      state_rule_1_main_text: null
      state_rule_1_background_color: null
      state_rule_1_text_color: null
      state_rule_1_hide_bar: false
      state_rule_1_hide_alt_text: false
      state_rule_2_value: null
      state_rule_2_condition: false
      state_rule_2_main_text: null
      state_rule_2_background_color: null
      state_rule_2_text_color: null
      state_rule_2_hide_bar: false
      state_rule_2_hide_alt_text: false
      state_rule_3_value: null
      state_rule_3_condition: false
      state_rule_3_main_text: null
      state_rule_3_background_color: null
      state_rule_3_text_color: null
      state_rule_3_hide_bar: false
      state_rule_3_hide_alt_text: false
    name: |
      [[[
        const subText = variables.sub_text == null ? '' : String(variables.sub_text).trim();
        return subText;
      ]]]
    icon: '[[[ return variables.icon ]]]'
    show_label: true
    show_icon: true
    show_state: |
      [[[
        const rule1Matched = entity && (
          (variables.state_rule_1_value !== null && entity.state === String(variables.state_rule_1_value)) ||
          (variables.state_rule_1_value === null && variables.state_rule_1_condition)
        );

        return variables.show_timer && rule1Matched;
      ]]]
    state:
      - operator: template
        value: |
          [[[
            if (!entity) return false;

            if (variables.state_rule_1_value !== null) {
              return entity.state === String(variables.state_rule_1_value);
            }

            if (variables.state_rule_1_condition) {
              return variables.state_rule_1_condition;
            }

            return false;
          ]]]
        label: |
          [[[
            return variables.state_rule_1_main_text !== null
              ? variables.state_rule_1_main_text
              : null;
          ]]]
        styles:
          card:
            - background: >-
                [[[ return variables.state_rule_1_background_color ||
                variables.background_color ]]]
          state:
            - color: >-
                [[[ return variables.state_rule_1_text_color ||
                variables.text_color ]]]
          label:
            - color: >-
                [[[ return variables.state_rule_1_text_color ||
                variables.text_color ]]]
          name:
            - color: >-
                [[[ return variables.state_rule_1_text_color ||
                variables.text_color ]]]
          icon:
            - color: >-
                [[[ return variables.state_rule_1_text_color ||
                variables.text_color ]]]
          img_cell:
            - width: '[[[ return variables.size === "small" ? "56px" : "52px" ]]]'
            - height: '[[[ return variables.size === "small" ? "56px" : "52px" ]]]'
            - padding: null
          custom_fields:
            mode:
              - color: >-
                  [[[ return variables.state_rule_1_text_color ||
                  variables.text_color ]]]
            bar:
              - display: |
                  [[[
                    return variables.state_rule_1_hide_bar ? 'none' : null;
                  ]]]
            alt:
              - color: >-
                  [[[ return variables.state_rule_1_text_color ||
                  variables.text_color ]]]
              - display: |
                  [[[
                    if (variables.size === 'small') return 'none';
                    return variables.state_rule_1_hide_alt_text ? 'none' : null;
                  ]]]
      - operator: template
        value: |
          [[[
            if (!entity) return false;

            if (variables.state_rule_2_value !== null) {
              return entity.state === String(variables.state_rule_2_value);
            }

            if (variables.state_rule_2_condition) {
              return variables.state_rule_2_condition;
            }

            return false;
          ]]]
        label: |
          [[[
            return variables.state_rule_2_main_text !== null
              ? variables.state_rule_2_main_text
              : null;
          ]]]
        styles:
          card:
            - background: >-
                [[[ return variables.state_rule_2_background_color ||
                variables.background_color ]]]
          state:
            - color: >-
                [[[ return variables.state_rule_2_text_color ||
                variables.text_color ]]]
          label:
            - color: >-
                [[[ return variables.state_rule_2_text_color ||
                variables.text_color ]]]
          name:
            - color: >-
                [[[ return variables.state_rule_2_text_color ||
                variables.text_color ]]]
          icon:
            - color: >-
                [[[ return variables.state_rule_2_text_color ||
                variables.text_color ]]]
          img_cell:
            - width: '[[[ return variables.size === "small" ? "56px" : "52px" ]]]'
            - height: '[[[ return variables.size === "small" ? "56px" : "52px" ]]]'
            - padding: null
          custom_fields:
            mode:
              - color: >-
                  [[[ return variables.state_rule_2_text_color ||
                  variables.text_color ]]]
            bar:
              - display: |
                  [[[
                    return variables.state_rule_2_hide_bar ? 'none' : null;
                  ]]]
            alt:
              - color: >-
                  [[[ return variables.state_rule_2_text_color ||
                  variables.text_color ]]]
              - display: |
                  [[[
                    if (variables.size === 'small') return 'none';
                    return variables.state_rule_2_hide_alt_text ? 'none' : null;
                  ]]]
      - operator: template
        value: |
          [[[
            if (!entity) return false;

            if (variables.state_rule_3_value !== null) {
              return entity.state === String(variables.state_rule_3_value);
            }

            if (variables.state_rule_3_condition) {
              return variables.state_rule_3_condition;
            }

            return false;
          ]]]
        label: |
          [[[
            return variables.state_rule_3_main_text !== null
