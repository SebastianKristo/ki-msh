        - justify-self: start
        - align-self: end
        - font-size: '[[[ return variables.size === "small" ? "16px" : "2em" ]]]'
        - font-weight: '[[[ return variables.size === "small" ? "500" : "300" ]]]'
        - color: '[[[ return variables.text_color ]]]'
        - line-height: 1.5em
      custom_fields:
        badge:
          - position: absolute
          - padding: 2px
          - right: 0px
