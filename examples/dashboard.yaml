# KI MSH · eksempel på dashbord (Rå konfigurasjonsredigering → lim inn / tilpass)
# Krever: Bubble Card (HACS), KI MSH (denne), temaet My SmartHome v3 (mørk), gjerne KI Rom-integrasjonen.
# Visningen er et grid (type: sections) – aldri panel. Navbaren ligger i egen seksjon, utenfor alle popups.
# Alle innholdskort autokonfigureres; bruk kortets editor (blyant / tannhjul) for overrides / exclude / include.
#
# Popup-mønster: hver popup er en vertical-stack med bubble-card pop-up først og innholdskortene under
# (samme som Bubble Cards «Legg til kort» i pop-up-editoren). Toppkortet (hero) er alltid første innholdskort.

title: Hjem
views:
  - title: Hjem
    path: hjem
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------------- navbar (egen seksjon)
      - type: grid
        cards:
          - type: custom:msh-navbar-card
            bar: [vanning, media, klima, basseng, ruter]
            more: [gjoremal]

      # ---------------------------------------------------------------- Hjem
      - type: grid
        cards:
          - type: custom:msh-hjem-header-card
          - type: custom:msh-prosa-card
          - type: custom:msh-hjem-faner-card
          - type: custom:msh-soppel-card
            popup_hash: '#soppel'
            # sensor: sensor.dager_til_tomming   # auto hvis tomt
          - type: custom:msh-hjem-gjoremal-card

      # ---------------------------------------------------------------- popups
      - type: grid
        cards:
          # Rom: én popup per område, hash = area_id. Kortene henter rommet fra hashen.
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#stue'
                name: Stue
                icon: mdi:sofa
                bg_color: '#282828'
                bg_opacity: 100
                bg_blur: 0
              - type: custom:msh-rom-klima-card
              - type: custom:msh-rom-card

          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#kjokken'
                name: Kjøkken
                icon: mdi:countertop
                bg_color: '#282828'
                bg_opacity: 100
                bg_blur: 0
              - type: custom:msh-rom-klima-card
              - type: custom:msh-rom-card

          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#basseng'
                name: Basseng
                icon: mdi:pool
                bg_color: '#282828'
                bg_opacity: 100
                bg_blur: 0
              - type: custom:msh-basseng-hero-card
              - type: custom:msh-basseng-card

          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#ruter'
                name: Ruter
                icon: mdi:tram
                bg_color: '#282828'
                bg_opacity: 100
                bg_blur: 0
