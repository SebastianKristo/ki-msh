# KI MSH · eksempel på dashbord (Rå konfigurasjonsredigering → lim inn / tilpass)
# Krever: Bubble Card (HACS), KI MSH (denne), temaet My SmartHome v3 (mørk), gjerne KI Rom-integrasjonen.
# Visningen er et grid (type: sections) – aldri panel. Navbaren ligger i egen seksjon, utenfor alle popups.
# Alle innholdskort autokonfigureres; bruk kortets editor (blyant / tannhjul) for overrides / exclude / include.
#
# Popup-mønster (Bubble Card 3.x, frittstående pop-up): innholdskortene ligger i popupens `cards:`
# (= «Legg til kort» i Bubble Cards pop-up-editor). Toppkortet (hero) er alltid første kort.
# Eldre Bubble Card (< 3.1): legg bubble-card pop-up + kortene i en vertical-stack i stedet.

title: Hjem
views:
  - title: Hjem
    path: hjem
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------------- Hjem (ett kort, full bredde)
      # msh-hjem-card tegner hele Hjem-griden selv (mobil: én kolonne maks 420 px, marg 18/20/120 og 22 px mellom
      # blokkene; bred ≥1000 px: 2 kolonner, ≥1500 px: 3 kolonner + zoom) og måler margene mot dashbordflaten.
      # Hvert delkort konfigureres under cards.<navn> – behold type + card_id, så delkortets egen «Tilpass» lagrer hit.
      - type: grid
        column_span: 3          # = max_columns → seksjonen dekker hele bredden
        cards:
          - type: custom:msh-hjem-card
            card_id: hjem
            layout_mode: auto     # auto | mobil | stor
            # hidden: [strom]     # skjul blokker · order: [header, prosa, faner, soppel, strom, gjoremal] (mobil)
            cards:
              header:
                type: custom:msh-hjem-header-card
                card_id: hjem_header
              prosa:
                type: custom:msh-prosa-card
                card_id: hjem_prosa
              faner:
                type: custom:msh-hjem-faner-card
                card_id: hjem_faner
                # rooms: { stue: { color: 'var(--orange)', temperature: sensor.stue_temp_2 } }
              soppel:
                type: custom:msh-soppel-card
                card_id: hjem_soppel
                popup_hash: '#soppel'
                # sensor: sensor.dager_til_tomming   # auto hvis tomt
              strom:
                type: custom:msh-strompris-card
                card_id: hjem_strom
                popup_hash: '#strom'
                # overrides: { price: sensor.nordpool_kwh_no1_nok_3_10_025 }   # auto: nordpool/tibber/energi_data_service
              gjoremal:
                type: custom:msh-hjem-gjoremal-card
                card_id: hjem_gjoremal

      # ---------------------------------------------------------------- navbar (egen seksjon, fast plassert)
      - type: grid
        cards:
          - type: custom:msh-navbar-card
            bar: [vanning, media, klima, basseng, ruter]
            more: [gjoremal]

      # ---------------------------------------------------------------- popups
      - type: grid
        cards:
          # Rom: én popup per område, hash = #<area_id>. Kortene henter rommet fra hashen (bytt til dine rom).
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#stue'
            name: Stue
            icon: mdi:sofa
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-rom-klima-card
              - type: custom:msh-rom-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#kjokken'
            name: Kjøkken
            icon: mdi:countertop
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-rom-klima-card
              - type: custom:msh-rom-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#basseng'
            name: Basseng
            icon: mdi:pool
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-basseng-hero-card
              - type: custom:msh-basseng-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#ruter'
            name: Ruter
            icon: mdi:tram
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-ruter-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#klima'
            name: Klima
            icon: mdi:thermostat
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-klima-hero-card
              - type: custom:msh-klima-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#media'
            name: Media
            icon: mdi:cast
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-media-hero-card
              - type: custom:msh-media-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#vanning'
            name: Vanning
            icon: mdi:sprinkler
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-vanning-hero-card
              - type: custom:msh-vanning-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#sikkerhet'
            name: Sikkerhet
            icon: mdi:shield-home
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-sikkerhet-hero-card
              - type: custom:msh-sikkerhet-card

          - type: custom:bubble-card
            card_type: pop-up
            hash: '#vaer'
            name: Vær
            icon: mdi:weather-partly-cloudy
            bg_color: '#282828'
            bg_opacity: 100
            bg_blur: 0
            cards:
              - type: custom:msh-vaer-hero-card
