              - type: custom:bubble-card
                card_type: pop-up
                hash: '#klima'
                name: Klima
                icon: mdi:thermostat
                bg_color: '#282828'
                bg_opacity: 100
                bg_blur: 0
              - type: custom:msh-klima-hero-card
              - type: custom:msh-klima-card

          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: '#media'
                name: Media
                icon: mdi:cast
                bg_color: '#282828'
                bg_opacity: 100
                bg_blur: 0
              - type: custom:msh-media-hero-card
              - type: custom:msh-media-card

          - type: vertical-stack
