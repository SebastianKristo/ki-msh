# KI MSH · eksempel på dashbord (Rå konfigurasjonsredigering → lim inn / tilpass)
#
# ANBEFALT: la strategien lage alt automatisk – hele dashbordets YAML er da bare:
#   strategy:
#     type: custom:ki-dashboard
# Filen under viser tilsvarende manuelt oppsett (brukes også av test/checklist.mjs).
# Krever: Bubble Card (HACS), KI MSH (denne), temaet My SmartHome v3 (mørk), gjerne KI Rom-integrasjonen.
# Visningen er et grid (type: sections) – aldri panel. Navbaren ligger i egen seksjon, utenfor alle popups.
# Alle innholdskort autokonfigureres; bruk kortets editor (blyant / tannhjul) for overrides / exclude / include.
#
# Popups (Bubble Card 3.x, frittstående pop-up) – nøyaktig ETT kort i cards: per popup. Kortet tegner hele
# innholdet; toppkortet (klima-toppkort / hero) er første seksjon inni kortet.
#   Mal A = funksjons-popups (header --gray000, ikon-sirkel --gray1000), Mal B = rom-popups (header --gray200,
#   ikon-sirkel i romfargen – oppdateres automatisk når romfargen/-ikonet endres i «Tilpass rom»/«Tilpass Hjem»).
#   Popupene kan også lages automatisk: «Tilpass Hjem» → Popups → «Opprett / oppdater popups».

title: Hjem
views:
  - title: Hjem
    path: hjem
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------------- Hjem (ett kort, full bredde)
      # msh-hjem-card tegner hele Hjem-griden selv (mobil: én kolonne maks 420 px, marg 18/20/120 og 22 px mellom
      # blokkene; bred ≥1000 px: 2 kolonner, ≥1500 px: 3 kolonner + zoom) og måler margene mot dashbordflaten.
      # Hvert delkort konfigureres under cards.<navn> – behold type + card_id, så delkortets egen «Tilpass» lagrer hit.
      - type: grid
        column_span: 3          # = max_columns → seksjonen dekker hele bredden
        cards:
          - type: custom:msh-hjem-card
            card_id: hjem
            layout_mode: auto     # auto | mobil | stor
            # hidden: [strom]     # skjul blokker · order: [header, prosa, faner, soppel, strom, gjoremal] (mobil)
            cards:
              header:
                type: custom:msh-hjem-header-card
                card_id: hjem_header
              prosa:
                type: custom:msh-prosa-card
                card_id: hjem_prosa
              faner:
                type: custom:msh-hjem-faner-card
                card_id: hjem_faner
                # rooms: { stue: { color: 'var(--orange)', temperature: sensor.stue_temp_2 } }
              soppel:
                type: custom:msh-soppel-card
                card_id: hjem_soppel
                popup_hash: '#soppel'
                # sensor: sensor.dager_til_tomming   # auto hvis tomt
              strom:
                type: custom:msh-strompris-card
                card_id: hjem_strom
                popup_hash: '#strom'
                # overrides: { price: sensor.nordpool_kwh_no1_nok_3_10_025 }   # auto: nordpool/tibber/energi_data_service
              gjoremal:
                type: custom:msh-hjem-gjoremal-card
                card_id: hjem_gjoremal

      # ---------------------------------------------------------------- navbar (egen seksjon, fast plassert)
      - type: grid
        cards:
          - type: custom:msh-navbar-card
            bar: [vanning, media, klima, basseng, ruter]
            more: [gjoremal]


      # ---------------------------------------------------------------- popups
      - type: grid
        cards:
          # Mal B – rom-popups: én per HA-område, hash = #<area_id> (bytt til dine rom). msh-rom-card henter rommet
          # fra hashen; klima-toppkortet er første seksjon. Mellomrom (gap / pad_top / pad_bottom) i «Tilpass rom».
          - type: custom:bubble-card
            card_type: pop-up
            name: Stue
            icon: mdi:sofa
            state: null
            hash: '#stue'
            is_sidebar_hidden: true
            styles: |-
              .bubble-pop-up-container {
                --vertical-stack-card-gap: 0px!important;
              } #header-container > div > div {
                background: var(--gray200)!important;
              }
              #header-container > button {background: none;}
              .icon-container {background-color:var(--orange)!important;}
              .icon-container > ha-icon {color:var(--black)!important;opacity:1!important}
              .bubble-icon {
                --mdc-icon-size: 24px !important;
              }
            bg_blur: '20'
            shadow_opacity: '20'
            bg_opacity: '88'
            margin_top_mobile: 50px
            margin_top_desktop: 50px
            card_layout: large
            button_type: name
            sub_button:
              main: []
              bottom: []
            slider_fill_orientation: left
            slider_value_position: right
            cards:
              - type: custom:msh-rom-card
                card_id: rom_stue
          - type: custom:bubble-card
            card_type: pop-up
            name: Kjøkken
            icon: mdi:countertop
