name: Release

# Ny versjon: push en tag (f.eks. `git tag v55.0.0 && git push origin v55.0.0`) eller kjør workflowen for hånd → GitHub-release med siste seksjon fra
# CHANGELOG.md. HACS installerer integrasjonen fra den nyeste releasen (custom_components/ki_msh i taggen).
on:
  push:
    tags: ['v*']
  # Eller start den i Actions → Release → Run workflow med en ny tag (opprettes på main)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Ny tag, f.eks. v55.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release-notater fra CHANGELOG.md
        run: |
          {
            echo "**KI MSH er en Home Assistant-integrasjon.** HACS → ⋮ → *Custom repositories* → \`https://github.com/${GITHUB_REPOSITORY}\`, type **Integration**. Har du lagt til repoet som *Dashboard* tidligere: fjern det i HACS og legg det til på nytt som *Integration* (se README → «Fra plugin-utgaven»)."
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md
          } > notes.md
      - name: Opprett release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG · KI MSH $(jq -r .version custom_components/ki_msh/manifest.json)" --notes-file notes.md --latest
