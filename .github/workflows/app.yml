name: App (iOS og Android)

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'test/mock/**', 'test/mock-hass.js', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'src/**', 'test/mock/**', 'test/mock-hass.js', '.github/workflows/app.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: ki-msh-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Bygg for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/ki-msh-ios-simulator.zip" App.app
      - name: Bygg for iPhone (usignert .ipa)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/ki-msh-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ki-msh-ios
          path: |
            ki-msh-ios-simulator.zip
            ki-msh-ios-unsigned.ipa
