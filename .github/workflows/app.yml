name: App (iOS og Android)

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'test/mock/**', 'test/mock-hass.js', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'src/**', 'test/mock/**', 'test/mock-hass.js', '.github/workflows/app.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KI_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: echo "KI_VERSION_NAME=$(node -p "require('./package.json').version")-$KI_VERSION_CODE" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Bygg APK (signert med fast nøkkel hvis den finnes)
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ki.jks"
            KI_KEYSTORE="$RUNNER_TEMP/ki.jks" ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ki-msh.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 mangler – bygger debug-APK, og oppdatering i appen publiseres ikke"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ki-msh.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ki-msh-android-apk
          path: ki-msh.apk
      - name: Publiser oppdatering til appen (grenen android-oppdatering)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir pub && mv ki-msh.apk pub/
          jq -n --argjson code "$KI_VERSION_CODE" --arg name "$KI_VERSION_NAME" --arg notes "$(printf '%s\n' "$NOTES" | grep -Ev '^(Merge pull request|Co-Authored-By|Claude-Session)' | sed '/./,$!d' | head -c 600)" \
            --arg apk "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/android-oppdatering/ki-msh.apk" \
            --arg date "$(date -u +%FT%TZ)" --arg sha "$GITHUB_SHA" \
            '{versionCode:$code, versionName:$name, notes:$notes, apk:$apk, date:$date, commit:$sha}' > pub/latest.json
          cat pub/latest.json
          cd pub && git init -q -b android-oppdatering
          git add -A && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Android $KI_VERSION_NAME"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" android-oppdatering

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Bygg for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/ki-msh-ios-simulator.zip" App.app
      - name: Bygg for iPhone (usignert .ipa)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/dev/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/ki-msh-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ki-msh-ios
          path: |
            ki-msh-ios-simulator.zip
            ki-msh-ios-unsigned.ipa
