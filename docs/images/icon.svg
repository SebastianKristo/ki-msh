<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- KI MSH · My SmartHome-dashbord: hus-tak over et dashbord med fire fliser og navbaren nederst -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a8da"/><stop offset="1" stop-color="#f285c9"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- taket -->
  <path d="M56 104 L128 48 L200 104" fill="none" stroke="#fafafa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fire fliser (rom/funksjoner) -->
  <rect x="68" y="100" width="54" height="46" rx="14" fill="#f2b573"/>
  <rect x="134" y="100" width="54" height="46" rx="14" fill="#73b9f2"/>
  <rect x="68" y="156" width="54" height="46" rx="14" fill="#66d19e"/>
  <rect x="134" y="156" width="54" height="46" rx="14" fill="url(#pk)"/>
  <!-- navbaren -->
  <rect x="72" y="214" width="112" height="16" rx="8" fill="#fafafa" opacity=".92"/>
  <circle cx="96" cy="222" r="3.5" fill="#f285c9"/>
  <circle cx="120" cy="222" r="3.5" fill="#696969"/>
  <circle cx="144" cy="222" r="3.5" fill="#696969"/>
  <circle cx="168" cy="222" r="3.5" fill="#696969"/>
</svg>
